# Production stack: HTTPS (Caddy) -> app -> MySQL + Redis.
#
#   cp .env.production.example .env   # then fill in the values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80 and 443). The database, Redis and the app itself are reachable
# only from inside the Docker network.
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helpdesk_db}
      MYSQL_USER: ${MYSQL_USER:-helpdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # Rate-limit counters only: no need to persist them
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (at least 32 random characters)}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-helpdesk}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-helpdesk_db}
      REDIS_URL: redis://redis:6379/0
      # The app is not published, so the only thing that can reach it is Caddy
      FORWARDED_ALLOW_IPS: "*"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (for example helpdesk.example.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
